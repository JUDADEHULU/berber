<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>夏日幸福小事打卡</title>
  <style>
/* ===== 全局重置与基础 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sky: #e0f7ff;
  --ocean: #29b6f6;
  --sun: #ffca28;
  --watermelon: #ef5350;
  --leaf: #66bb6a;
  --peach: #ff8a65;
  --coral: #ff7043;
  --mint: #4dd0e1;
  --card-bg: rgba(255,255,255,0.88);
  --shadow: 0 4px 24px rgba(41,182,246,0.13);
  --radius: 20px;
  --font: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
}

body {
  font-family: var(--font);
  background: linear-gradient(160deg, #b3e5fc 0%, #e0f7fa 40%, #fff9e6 80%, #fce4ec 100%);
  min-height: 100vh;
  color: #333;
  overflow-x: hidden;
}

.bg-deco {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.deco-emoji {
  position: absolute;
  opacity: 0.18;
  animation: floatDeco 6s ease-in-out infinite alternate;
}
.deco-emoji:nth-child(odd)  { animation-duration: 7s; }
.deco-emoji:nth-child(even) { animation-duration: 5s; }
@keyframes floatDeco {
  from { transform: translateY(0) rotate(-5deg); }
  to   { transform: translateY(-18px) rotate(5deg); }
}

.container {
  position: relative;
  z-index: 1;
  max-width: 960px;
  margin: 0 auto;
  padding: 0 16px 60px;
}

/* ===== 标题 ===== */
.hero {
  text-align: center;
  padding: 48px 0 24px;
}
.hero-title {
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: 2px;
}
.title-main   { color: #37474f; }
.title-summer {
  color: var(--ocean);
  text-shadow: 0 2px 8px rgba(41,182,246,0.3);
}
.hero-sub {
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 800;
  color: var(--coral);
  margin-top: 6px;
  letter-spacing: 3px;
}
.hero-icons {
  margin-top: 12px;
  font-size: 1.6rem;
  letter-spacing: 8px;
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}

/* ===== 统计卡片 ===== */
.stats-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px 32px 24px;
  margin-bottom: 24px;
  backdrop-filter: blur(8px);
  border: 1.5px solid rgba(255,255,255,0.7);
}
.stats-row {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 18px;
}
.stats-num-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
.stats-num {
  font-size: 2.4rem;
  font-weight: 900;
  color: var(--ocean);
  line-height: 1;
}
.stats-label {
  font-size: 0.85rem;
  color: #888;
  margin-top: 4px;
}
.stats-divider {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, transparent, #c9e9ff, transparent);
}

.progress-bar-wrap { margin-bottom: 16px; }
.progress-bar-bg {
  background: #e8f4f8;
  border-radius: 99px;
  height: 14px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--ocean), var(--mint), var(--sun));
  transition: width 0.6s cubic-bezier(.25,.8,.25,1);
  width: 0%;
}

.evaluation {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, #e0f7fa, #fff9e6);
  border-radius: 12px;
  padding: 12px 20px;
  border: 1.5px dashed var(--mint);
}
.eval-icon { font-size: 1.6rem; animation: bounce 1.5s infinite; }
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}
.eval-text {
  font-size: 1rem;
  font-weight: 600;
  color: #37474f;
  line-height: 1.4;
}

/* ===== 手动输入 ===== */
.custom-section {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 28px;
  margin-bottom: 24px;
  backdrop-filter: blur(8px);
  border: 1.5px solid rgba(255,255,255,0.7);
}
.custom-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--coral);
  margin-bottom: 14px;
}
.custom-input-row {
  display: flex;
  gap: 10px;
}
.custom-input {
  flex: 1;
  border: 2px solid #c5e8f7;
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 0.95rem;
  font-family: var(--font);
  outline: none;
  background: #f0faff;
  transition: border-color 0.2s, box-shadow 0.2s;
  color: #333;
}
.custom-input:focus {
  border-color: var(--ocean);
  box-shadow: 0 0 0 3px rgba(41,182,246,0.12);
  background: #fff;
}
.custom-btn {
  background: linear-gradient(135deg, var(--ocean), var(--mint));
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 10px 20px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.15s, box-shadow 0.15s;
  font-family: var(--font);
}
.custom-btn:hover  { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(41,182,246,0.3); }
.custom-btn:active { transform: translateY(0); }

.custom-list {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.custom-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, #e0fdf4, #d1fae5);
  border: 1.5px solid #6ee7b7;
  border-radius: 99px;
  padding: 5px 12px 5px 10px;
  font-size: 0.88rem;
  color: #065f46;
  font-weight: 600;
  animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.custom-tag-del {
  cursor: pointer;
  color: #a7a7a7;
  font-size: 1rem;
  line-height: 1;
  transition: color 0.2s;
  font-weight: 900;
}
.custom-tag-del:hover { color: var(--watermelon); }

/* ===== 清单列表 ===== */
.list-section {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 24px 32px;
  backdrop-filter: blur(8px);
  border: 1.5px solid rgba(255,255,255,0.7);
}
.list-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--ocean);
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px dashed #b3e5fc;
}
.items-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}

.item-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1.5px solid #e0f4ff;
  background: #f8fcff;
  cursor: pointer;
  transition: all 0.22s ease;
  user-select: none;
}
.item-card:hover {
  border-color: var(--ocean);
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(41,182,246,0.15);
}
.item-card.checked {
  border-color: var(--leaf);
  background: linear-gradient(135deg, #f0fff4, #e8fdf0);
  box-shadow: 0 2px 10px rgba(102,187,106,0.15);
}
.item-card.checked .item-text {
  color: #2e7d32;
  text-decoration: line-through;
  text-decoration-color: #a5d6a7;
}

.item-checkbox {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid #b3d9f5;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: #fff;
  transition: all 0.2s;
  font-size: 0.85rem;
  font-weight: 700;
  color: transparent;
}
.item-card.checked .item-checkbox {
  background: var(--leaf);
  border-color: var(--leaf);
  color: #fff;
}
.item-num {
  font-size: 0.72rem;
  color: #b0bec5;
  flex-shrink: 0;
  min-width: 20px;
  font-weight: 600;
}
.item-text {
  font-size: 0.88rem;
  color: #455a64;
  line-height: 1.3;
  transition: color 0.2s;
  flex: 1;
}

@keyframes checkPop {
  0%   { transform: scale(0.5) rotate(-10deg); }
  60%  { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.item-card.just-checked .item-checkbox {
  animation: checkPop 0.35s cubic-bezier(.34,1.56,.64,1);
}

.footer {
  text-align: center;
  padding: 30px 0 0;
  color: #90a4ae;
  font-size: 0.9rem;
  letter-spacing: 2px;
}

@media (max-width: 600px) {
  .container { padding: 0 10px 40px; }
  .stats-card { padding: 20px 16px 18px; }
  .custom-section { padding: 18px 16px; }
  .list-section { padding: 18px 14px 24px; }
  .items-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .stats-num { font-size: 1.8rem; }
  .item-card { padding: 9px 10px; }
  .item-text { font-size: 0.82rem; }
}
  </style>
</head>
<body>

<div class="bg-deco">
  <span class="deco-emoji" style="top:3%;left:4%;font-size:2.2rem;">🌊</span>
  <span class="deco-emoji" style="top:6%;left:88%;font-size:2.8rem;">🍦</span>
  <span class="deco-emoji" style="top:10%;left:50%;font-size:1.8rem;">🌸</span>
  <span class="deco-emoji" style="top:1%;left:70%;font-size:1.5rem;">🌞</span>
  <span class="deco-emoji" style="top:2%;left:20%;font-size:1.5rem;">🌺</span>
</div>

<div class="container">
  <header class="hero">
    <div class="hero-title">
      <span class="title-main">适合</span><span class="title-summer">夏天</span><span class="title-main">做的</span>
    </div>
    <div class="hero-sub">100件幸福小事打卡</div>
    <div class="hero-icons">🍉 🌴 🌻 🍋 🎐</div>
  </header>

  <section class="stats-card">
    <div class="stats-row">
      <div class="stats-num-block">
        <span class="stats-num" id="checkedCount">0</span>
        <span class="stats-label">已打卡</span>
      </div>
      <div class="stats-divider"></div>
      <div class="stats-num-block">
        <span class="stats-num" id="totalCount">100</span>
        <span class="stats-label">总数</span>
      </div>
      <div class="stats-divider"></div>
      <div class="stats-num-block">
        <span class="stats-num" id="percentNum">0%</span>
        <span class="stats-label">完成率</span>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="evaluation">
      <span class="eval-icon" id="evalIcon">🌱</span>
      <span class="eval-text" id="evalText">快来开始你的夏日打卡之旅吧！</span>
    </div>
  </section>

  <section class="custom-section">
    <div class="custom-title">✏️ 添加我的幸福小事</div>
    <div class="custom-input-row">
      <input
        type="text"
        id="customInput"
        class="custom-input"
        placeholder="输入你的幸福小事，回车即为已打卡~"
        maxlength="30"
      />
      <button class="custom-btn" id="customAddBtn">打卡 ✓</button>
    </div>
    <div class="custom-list" id="customList"></div>
  </section>

  <section class="list-section">
    <div class="list-title">📋 夏日幸福清单</div>
    <div class="items-grid" id="itemsGrid"></div>
  </section>

  <footer class="footer">🌈 愿你的夏天充满幸福小确幸 🌈</footer>
</div>

<script>
const SUMMER_ITEMS = [
  "看一场夏日音乐节","买新鲜水果做水果捞","去海边看日落","到山里捉萤火虫",
  "做各种各样的凉拌菜","暴雨之后去街上散步","听树上的蝉鸣声","和朋友一起钓龙虾",
  "换夏天味道的沐浴露","海滩上收集贝壳","去山里度假村避暑","在海岛环岛骑行",
  "去果园采杨梅","下雨后看彩虹","享受漂流的刺激","买好看的绣球花",
  "和朋友一起打水仗","闻雨后青草的味道","雨后踩水塘","制作孔明灯",
  "举办夏日茶话会","自制夏日风味果酱","用花草做扎染","制作彩虹沙拉",
  "自制冰淇淋","看夏季主题电影","举办水枪大战","赏荷花采摘莲蓬",
  "收集夏天的花","学习手工编织","制作冰咖啡","去水上乐园冲浪",
  "了解夏日节气习俗","学习游泳等新技能","去稻田里奔跑","刷着剧大勺吃西瓜",
  "在阴凉处吹自然风","和好友约一顿宵夜","画一副夏日主题画","衣橱里塞满夏天的衣服",
  "黄昏雨后散步看晚霞","制作夏日必听歌单","去河边捡漂亮的石头","自己DIY短袖",
  "逛花鸟市场","在沙滩上堆城堡","在吊床上小憩","种植一盆向日葵",
  "在海边放烟花","举办泡泡派对","学习制作椰子鸡","制作夏日小风铃",
  "晚上逛公园纳凉","闻栀子花的味道","自己做一碗绿豆汤","赤脚在草地上奔跑",
  "去河边打水漂","认真观察星星","骑车傍晚兜风","吃一次烛光晚餐",
  "把冰箱塞满雪糕","买一串夏日手链","穿好看的裙子","看一场露天电影",
  "在咖啡馆听雨声","参加夜校课程","看和夏天有关的书","做夏日主题的美甲",
  "逛夜市淘美食","换清凉四件套","品尝水蜜桃","喝橘子味的汽水",
  "点果味的香薰","记录夏日小确幸","学习滑板","约朋友一起烧烤",
  "吃放冰块的冷面","体验皮划艇","拍夏日写真","逛植物园",
  "傍晚打篮球","在沙发上午睡","吃冰镇糖水","看火烧云",
  "去山里徒步","水培荔枝","自制喝粥小菜","来一场户外冥想",
  "泡个养生澡","贴三伏贴","盖被子吹空调","晚上夜跑",
  "煲祛湿汤","制作夏日食谱","清理储物间","开睡衣party",
  "享受沙滩日光浴","去游乐园玩过山车","去健身房出汗","自制驱蚊水"
];

const EVALUATIONS = [
  { min:0,   max:0,   icon:"🌱", text:"快来开始你的夏日打卡之旅吧！" },
  { min:1,   max:9,   icon:"🌸", text:"已经迈出第一步啦，继续探索夏天的美好！" },
  { min:10,  max:19,  icon:"🌻", text:"打卡了 {n} 件！夏天的幸福正在慢慢积累中~" },
  { min:20,  max:29,  icon:"🍉", text:"哇！{n} 件打卡完成，你的夏天开始有滋有味了！" },
  { min:30,  max:39,  icon:"🌊", text:"完成 {n} 件！你是个热爱生活的快乐小孩～" },
  { min:40,  max:49,  icon:"🎐", text:"达成 {n} 件！你的夏天色彩缤纷，令人羡慕！" },
  { min:50,  max:59,  icon:"🍦", text:"过半啦！{n} 件幸福小事，你的夏天超级充实！" },
  { min:60,  max:69,  icon:"🌴", text:"打卡 {n} 件！你已经是夏日幸福达人了！" },
  { min:70,  max:79,  icon:"🦋", text:"惊人的 {n} 件！这个夏天你活得太精彩了！" },
  { min:80,  max:89,  icon:"🌈", text:"了不起！{n} 件幸福小事，你是真正的夏日传奇！" },
  { min:90,  max:99,  icon:"✨", text:"接近满分！{n} 件！你把夏天活成了诗和远方！" },
  { min:100, max:9999,icon:"🏆", text:"全部完成！你是夏日幸福100分满分达人！太棒了！" },
];

const STORAGE_KEY = "summer_checkin_v2";
let state = { checked: new Set(), custom: [] };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    state.checked = new Set((obj.checked || []).map(Number));
    state.custom = obj.custom || [];
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    checked: Array.from(state.checked),
    custom: state.custom
  }));
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderItems() {
  const grid = document.getElementById("itemsGrid");
  grid.innerHTML = "";
  SUMMER_ITEMS.forEach((text, i) => {
    const checked = state.checked.has(i);
    const card = document.createElement("div");
    card.className = "item-card" + (checked ? " checked" : "");
    card.dataset.index = i;
    const box = document.createElement("div");
    box.className = "item-checkbox";
    box.textContent = checked ? "✓" : "";
    const num = document.createElement("span");
    num.className = "item-num";
    num.textContent = i + 1;
    const label = document.createElement("span");
    label.className = "item-text";
    label.textContent = text;
    card.appendChild(box);
    card.appendChild(num);
    card.appendChild(label);
    card.addEventListener("click", () => toggleItem(i, card));
    grid.appendChild(card);
  });
}

function toggleItem(index, card) {
  if (state.checked.has(index)) {
    state.checked.delete(index);
    card.classList.remove("checked");
    card.querySelector(".item-checkbox").textContent = "";
  } else {
    state.checked.add(index);
    card.classList.add("checked");
    card.classList.add("just-checked");
    card.querySelector(".item-checkbox").textContent = "✓";
    setTimeout(() => card.classList.remove("just-checked"), 400);
  }
  saveState();
  updateStats();
}

function renderCustomList() {
  const list = document.getElementById("customList");
  list.innerHTML = "";
  state.custom.forEach(item => {
    const tag = document.createElement("span");
    tag.className = "custom-tag";
    const ck = document.createElement("span");
    ck.textContent = "✅";
    const txt = document.createElement("span");
    txt.textContent = item.text;
    const del = document.createElement("span");
    del.className = "custom-tag-del";
    del.textContent = "×";
    del.title = "删除";
    del.addEventListener("click", (e) => { e.stopPropagation(); removeCustom(item.id); });
    tag.appendChild(ck);
    tag.appendChild(txt);
    tag.appendChild(del);
    list.appendChild(tag);
  });
}

function updateStats() {
  const checkedPreset = state.checked.size;
  const checkedCustom = state.custom.length;
  const total = SUMMER_ITEMS.length + checkedCustom;
  const checked = checkedPreset + checkedCustom;
  const percent = total > 0 ? Math.round(checked / total * 100) : 0;

  document.getElementById("checkedCount").textContent = checked;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("percentNum").textContent = percent + "%";
  document.getElementById("progressFill").style.width = percent + "%";

  const ev = EVALUATIONS.find(e => checked >= e.min && checked <= e.max) || EVALUATIONS[EVALUATIONS.length - 1];
  document.getElementById("evalIcon").textContent = ev.icon;
  document.getElementById("evalText").textContent = ev.text.replace("{n}", checked);
}

function addCustom(text) {
  text = text.trim();
  if (!text) return;
  const id = Date.now() + "_" + Math.random();
  state.custom.push({ id, text });
  saveState();
  renderCustomList();
  updateStats();
}

function removeCustom(id) {
  state.custom = state.custom.filter(item => item.id !== id);
  saveState();
  renderCustomList();
  updateStats();
}

function init() {
  loadState();
  renderItems();
  renderCustomList();
  updateStats();

  const input = document.getElementById("customInput");
  const addBtn = document.getElementById("customAddBtn");

  addBtn.addEventListener("click", () => {
    addCustom(input.value);
    input.value = "";
    input.focus();
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { addCustom(input.value); input.value = ""; }
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
