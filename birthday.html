<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎂 生日快乐！倒计时拼图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
    background: linear-gradient(145deg, #fffbeb 0%, #fef3c7 40%, #fde68a 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }
  /* 背景圆点纹理 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(circle, rgba(251,191,36,0.12) 1.5px, transparent 1.5px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }
  /* 浮动小图标层 */
  .bg-floaters {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .floater {
    position: absolute;
    font-size: 24px;
    opacity: 0;
    animation: floaterDrift linear infinite;
  }
  @keyframes floaterDrift {
    0%   { transform: translateY(0) rotate(0deg) scale(0.7); opacity: 0; }
    8%   { opacity: 0.5; }
    50%  { opacity: 0.35; }
    92%  { opacity: 0.5; }
    100% { transform: translateY(-110vh) rotate(360deg) scale(1); opacity: 0; }
  }
  .container {
    max-width: 520px;
    width: 100%;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(14px);
    border-radius: 36px;
    padding: 30px 24px 35px;
    box-shadow: 0 20px 60px rgba(245, 158, 11, 0.15);
    text-align: center;
    position: relative;
    overflow: hidden;
    z-index: 1;
  }
  .container::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(251,191,36,0.2) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .container::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(245,158,11,0.15) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  h1 {
    font-size: 28px;
    color: #92400e;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
  .subtitle {
    font-size: 15px;
    color: #78350f;
    opacity: 0.7;
    margin-bottom: 18px;
  }

  /* 倒计时 */
  .countdown-label {
    font-size: 14px;
    color: #92400e;
    margin-bottom: 6px;
  }
  #countdown {
    font-size: 34px;
    font-weight: 800;
    color: #b45309;
    background: #fffbeb;
    padding: 12px 18px;
    border-radius: 60px;
    display: inline-block;
    margin-bottom: 24px;
    box-shadow: inset 0 2px 8px rgba(180,83,9,0.08);
    letter-spacing: 1px;
  }

  /* 礼盒区域 */
  .boxes {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .box {
    width: 90px;
    height: 110px;
    background: #fef3c7;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 12px rgba(146,64,14,0.1);
    position: relative;
    border: 2px solid transparent;
    user-select: none;
  }
  .box.locked {
    background: #e5e7eb;
    cursor: not-allowed;
    opacity: 0.65;
    transform: scale(0.92);
  }
  .box.unlocked {
    background: #fde68a;
    border-color: #fbbf24;
    cursor: pointer;
  }
  .box.unlocked:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 12px 24px rgba(251,191,36,0.3);
  }
  .box.opened {
    background: #fcd34d;
    border-color: #f59e0b;
    transform: rotateY(10deg) scale(0.98);
    pointer-events: none;
  }
  .box-icon {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .box-day {
    font-size: 13px;
    font-weight: 600;
    color: #78350f;
  }
  .box-status {
    font-size: 11px;
    margin-top: 2px;
    color: #92400e;
  }

  /* 拼图板 */
  .puzzle-area {
    margin-bottom: 20px;
  }
  .puzzle-title {
    font-size: 16px;
    font-weight: 600;
    color: #92400e;
    margin-bottom: 10px;
  }
  .puzzle-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    width: 220px;
    height: 220px;
    margin: 0 auto;
    background: #fef3c7;
    border-radius: 16px;
    padding: 4px;
    box-shadow: inset 0 0 0 2px #fde68a;
  }
  .piece {
    background: #fde68a;
    border-radius: 10px;
    transition: all 0.5s ease;
    position: relative;
    overflow: hidden;
  }
  .piece.locked {
    background: #e8d5b0 !important;
    cursor: default;
  }
  .piece.locked::after {
    content: "❓";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    opacity: 0.5;
  }
  .piece.unlocked {
    background-size: 200% 200%;
    background-repeat: no-repeat;
    box-shadow: inset 0 0 0 2px #f59e0b;
  }
  .piece.completed {
    box-shadow: 0 0 20px #f59e0b;
  }

  /* 模态框 */
  .modal-overlay {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    max-width: 380px;
    width: 100%;
    border-radius: 32px;
    padding: 30px 24px 28px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.2);
    text-align: center;
    animation: popIn 0.35s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal-emoji {
    font-size: 52px;
    margin-bottom: 8px;
  }
  .modal-message {
    font-size: 18px;
    color: #1e293b;
    line-height: 1.7;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .modal-piece-info {
    font-size: 14px;
    color: #b45309;
    margin-bottom: 18px;
    font-weight: 600;
  }
  .modal-btn {
    background: #f59e0b;
    color: white;
    border: none;
    padding: 10px 36px;
    border-radius: 60px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 4px 12px rgba(245,158,11,0.3);
  }
  .modal-btn:hover { background: #d97706; transform: scale(1.04); }

  /* 庆祝动画 */
  .celebration {
    display: none;
    position: relative;
    margin-top: 10px;
    z-index: 1;
  }
  .celebration.active { display: block; }
  .final-message {
    font-size: 26px;
    font-weight: 800;
    color: #78350f;
    background: linear-gradient(135deg, #fde68a, #fcd34d);
    padding: 18px 12px;
    border-radius: 30px;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(245,158,11,0.2);
    line-height: 1.5;
  }
  .confetti-container {
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 900;
  }
  .confetti {
    position: absolute;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  .balloon {
    position: fixed;
    bottom: -120px;
    font-size: 54px;
    animation: balloonRise 6s ease-in-out forwards;
    pointer-events: none;
    z-index: 950;
  }
  @keyframes balloonRise {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0.3; }
  }

  /* 完整拼图样式 - 4块解锁后的特效 */
  .puzzle-grid.completed {
    animation: glowPulse 2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: inset 0 0 0 2px #fde68a, 0 0 20px rgba(245,158,11,0.2); }
    50% { box-shadow: inset 0 0 0 2px #f59e0b, 0 0 30px rgba(245,158,11,0.4); }
  }

  /* 响应式 */
  @media (max-width: 480px) {
    .container { padding: 20px 16px; }
    #countdown { font-size: 26px; padding: 10px 14px; }
    .box { width: 70px; height: 88px; }
    .box-icon { font-size: 34px; }
    .puzzle-grid { width: 180px; height: 180px; }
    .puzzle-piece-art { font-size: 32px; }
  }
</style>
</head>
<body>

<!-- 浮动小图标层 -->
<div class="bg-floaters" id="bgFloaters"></div>

<div class="container" id="app">
  <h1>🎂 生日快乐</h1>
  <div class="subtitle">每一天都是惊喜</div>

  <!-- 倒计时 -->
  <div class="countdown-label">距离你的生日还有</div>
  <div id="countdown">--</div>

  <!-- 四个礼盒 -->
  <div class="boxes" id="boxesContainer"></div>

  <!-- 拼图板 -->
  <div class="puzzle-area">
    <div class="puzzle-title">🧩 生日拼图</div>
    <div class="puzzle-grid" id="puzzleGrid"></div>
  </div>

  <!-- 庆祝区域 -->
  <div class="celebration" id="celebrationArea">
    <div class="final-message" id="finalMessage"></div>
  </div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-emoji" id="modalEmoji">🎁</div>
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-piece-info" id="modalPieceInfo"></div>
    <button class="modal-btn" id="modalCloseBtn">收下祝福 💛</button>
  </div>
</div>

  // ----- 状态 -----
  let openedBoxes = [];
  let puzzleUnlocked = [];
  let isCelebrating = false;

  function loadState() {
    try {
      const data = JSON.parse(localStorage.getItem('birthday_puzzle_state_v2'));
      if (data) {
        openedBoxes = data.openedBoxes || [];
        puzzleUnlocked = data.puzzleUnlocked || [];
      }
    } catch(e) {}
  }
  function saveState() {
    localStorage.setItem('birthday_puzzle_state_v2', JSON.stringify({
      openedBoxes,
      puzzleUnlocked
    }));
  }

  // ----- 日期判断 -----
  function getTodayIndex() {
    const now = new Date();
    const beijing = new Date(now.toLocaleString('en-US', {timeZone:'Asia/Shanghai'}));
    const start = new Date(START_DATE.toLocaleString('en-US', {timeZone:'Asia/Shanghai'}));
    const diffDays = Math.floor((beijing - start) / 86400000);
    if (diffDays < 0) return -1;
    if (diffDays >= TOTAL_BOXES) return TOTAL_BOXES - 1;
    return diffDays;
  }

  function isBirthdayToday() {
    const now = new Date();
    const beijing = new Date(now.toLocaleString('en-US', {timeZone:'Asia/Shanghai'}));
    return beijing.getMonth() === 5 && beijing.getDate() === 25;
  }

  // ----- 倒计时 -----
  function updateCountdown() {
    const el = document.getElementById('countdown');
    const now = new Date();
    const diff = BIRTHDAY - now;
    if (diff <= 0) {
      el.innerText = '🎉 就是今天！生日快乐！';
      return;
    }
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    el.innerText = days + '天 ' + String(hours).padStart(2,'0') + ':' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();

  // ----- 渲染礼盒 -----
  function renderBoxes() {
    const container = document.getElementById('boxesContainer');
    const todayIdx = getTodayIndex();
    container.innerHTML = '';
    for (let i = 0; i < TOTAL_BOXES; i++) {
      const box = document.createElement('div');
      box.className = 'box';
      box.dataset.index = i;

      const dayStr = '6月' + (22 + i) + '日';
      const isLocked = i > todayIdx;
      const isOpened = openedBoxes.includes(i);
      const canOpen = !isLocked && !isOpened;

      if (isLocked) {
        box.classList.add('locked');
      } else if (isOpened) {
        box.classList.add('opened');
      } else {
        box.classList.add('unlocked');
      }

      var iconText = isOpened ? '🎀' : (isLocked ? '🔒' : '🎁');
      var statusText = isOpened ? '已拆' : (isLocked ? '等待' : '点击');

      box.innerHTML =
        '<div class="box-icon">' + iconText + '</div>' +
        '<div class="box-day">' + dayStr + '</div>' +
        '<div class="box-status">' + statusText + '</div>';

      if (canOpen) {
        (function(idx) {
          box.addEventListener('click', function() {
            openBox(idx);
          });
        })(i);
      }
      container.appendChild(box);
    }
  }

  // ----- 打开礼盒 -----
  function openBox(index) {
    if (openedBoxes.includes(index)) return;
    var todayIdx = getTodayIndex();
    if (index > todayIdx) return;

    openedBoxes.push(index);
    puzzleUnlocked.push(index);
    saveState();

    var message = MESSAGES[index] || '祝你每天都快乐！';
    var pieceNum = index + 1;
    var emojis = ['🎁','🌟','🌸','❤️'];
    document.getElementById('modalEmoji').textContent = emojis[index];
    document.getElementById('modalMessage').textContent = message;
    document.getElementById('modalPieceInfo').textContent = '🧩 获得第 ' + pieceNum + ' 块拼图';
    document.getElementById('modalOverlay').classList.add('active');

    document.getElementById('modalCloseBtn').onclick = function() {
      document.getElementById('modalOverlay').classList.remove('active');
      renderBoxes();
      renderPuzzle();
      checkCompletion();
    };

    renderBoxes();
    renderPuzzle();
  }

  // ----- 渲染拼图 -----
  function renderPuzzle() {
    var grid = document.getElementById('puzzleGrid');
    grid.innerHTML = '';
    grid.classList.remove('completed');

    var allUnlocked = puzzleUnlocked.length === TOTAL_PIECES;

    for (var i = 0; i < TOTAL_PIECES; i++) {
      var piece = document.createElement('div');
      piece.className = 'piece';
      var unlocked = puzzleUnlocked.includes(i);

      if (unlocked) {
        piece.classList.add('unlocked');
        if (allUnlocked) {
          piece.classList.add('completed');
        }
        var row = Math.floor(i / 2);
        var col = i % 2;
        piece.style.backgroundImage = 'url(' + PUZZLE_IMAGE + ')';
        piece.style.backgroundPosition = (col * 100) + '% ' + (row * 100) + '%';
        piece.style.backgroundSize = '200% 200%';
      } else {
        piece.classList.add('locked');
      }
      grid.appendChild(piece);
    }

    if (allUnlocked) {
      grid.classList.add('completed');
    }
  }

  // ----- 检查完成 -----
  function checkCompletion() {
    if (puzzleUnlocked.length === TOTAL_PIECES && !isCelebrating) {
      isCelebrating = true;
      showCelebration();
    }
  }

  // ----- 庆祝动画 -----
  function showCelebration() {
    var area = document.getElementById('celebrationArea');
    var finalMsg = document.getElementById('finalMessage');
    finalMsg.innerHTML = '🎉 拼图完成！<br>生日快乐！ber头！<br>有你的每一天，都是最好的礼物 ❤️';
    area.classList.add('active');
    launchConfetti();
    launchBalloons();
  }

  function launchConfetti() {
    var container = document.createElement('div');
    container.className = 'confetti-container';
    document.body.appendChild(container);
    var colors = ['#f59e0b','#fbbf24','#ef4444','#ec4899','#8b5cf6','#10b981','#f97316'];
    for (var i = 0; i < 100; i++) {
      var el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      var size = Math.random() * 8 + 4;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.animationDuration = (Math.random() * 3 + 2) + 's';
      el.style.animationDelay = (Math.random() * 2) + 's';
      container.appendChild(el);
    }
    setTimeout(function() { container.remove(); }, 7000);
  }

  function launchBalloons() {
    var emojis = ['🎈','🎉','🎊','💖','🌟','🧡','🎂','✨'];
    for (var i = 0; i < 14; i++) {
      var el = document.createElement('div');
      el.className = 'balloon';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (Math.random() * 90 + 5) + '%';
      el.style.fontSize = (Math.random() * 20 + 36) + 'px';
      el.style.animationDuration = (Math.random() * 4 + 5) + 's';
      el.style.animationDelay = (Math.random() * 3) + 's';
      document.body.appendChild(el);
      (function(elem) {
        setTimeout(function() { elem.remove(); }, 10000);
      })(el);
    }
  }

  function autoCelebrateIfBirthday() {
    if (isBirthdayToday() && puzzleUnlocked.length === TOTAL_PIECES && !isCelebrating) {
      showCelebration();
    }
  }

  // ----- 初始化 -----
  function init() {
    loadState();
    renderBoxes();
    renderPuzzle();

    if (puzzleUnlocked.length === TOTAL_PIECES) {
      if (isBirthdayToday()) {
        showCelebration();
      } else {
        var area = document.getElementById('celebrationArea');
        area.classList.add('active');
        document.getElementById('finalMessage').innerHTML = '🎉 拼图已完成！<br>生日当天会有更大的惊喜哦 🎂';
      }
    }

    setInterval(autoCelebrateIfBirthday, 60000);
  }

  // ----- 浮动背景图标 -----
  function spawnFloaters() {
    var container = document.getElementById('bgFloaters');
    var emojis = ['🎈','🎁','🌟','🧁','🎂','✨','💛','🎉','🧡','🌸','🎊','⭐'];
    for (var i = 0; i < 18; i++) {
      var el = document.createElement('div');
      el.className = 'floater';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.bottom = -50 + 'px';
      el.style.fontSize = (Math.random() * 14 + 18) + 'px';
      el.style.animationDuration = (Math.random() * 12 + 14) + 's';
      el.style.animationDelay = (Math.random() * 15) + 's';
      container.appendChild(el);
    }
  }

  init();
  spawnFloaters();
})();
</script>
</body>
</html>
